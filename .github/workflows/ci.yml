name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Let every OS report its own failures instead of cancelling the rest.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Before checkout so Windows does not rewrite line endings in fixtures.
      # The identity is for tests that run `git commit`.
      - name: Configure git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.name "Assentor CI"
          git config --global user.email "ci@assentor.invalid"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # pnpm 11 needs Node >= 22.13; GitHub Actions no longer supports Node 20.
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
