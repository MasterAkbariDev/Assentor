name: Desktop packaging spike

on:
  workflow_dispatch:
  push:
    branches: [desktop/phase-5]
    paths:
      - ".github/workflows/desktop-packaging-spike.yml"
      - "apps/desktop/src-tauri/**"
      - "packages/ui/**"
      - "scripts/desktop/**"

permissions:
  contents: read

jobs:
  package:
    name: Preview package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
          - os: macos-15
            bundles: dmg
          - os: windows-2025
            bundles: nsis
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libfuse2t64

      - name: Build the native preview
        run: |
          pnpm install --frozen-lockfile
          node scripts/desktop/build-sidecar.mjs
          pnpm build:ui
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Assemble the preview package
        working-directory: apps/desktop
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          APPLE_SIGNING_IDENTITY: "-"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          printf '%s\n' '{"bundle":{"active":true,"useLocalToolsDir":true}}' > "$RUNNER_TEMP/tauri-preview.json"
          npm exec --yes --package=@tauri-apps/cli@2.12.0 -- tauri bundle --debug --bundles "$BUNDLES" --config "$RUNNER_TEMP/tauri-preview.json"

      - name: Verify the nested macOS executable
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri/target/debug/bundle
        run: |
          package=$(find dmg -name '*.dmg' -print -quit)
          test -n "$package"
          mounted=$(mktemp -d "$RUNNER_TEMP/assentor-dmg.XXXXXX")
          hdiutil attach -readonly -nobrowse -mountpoint "$mounted" "$package"
          trap 'hdiutil detach "$mounted"' EXIT
          sidecar=$(find "$mounted" -path '*/Contents/MacOS/assentor-engine' -print -quit)
          test -n "$sidecar"
          codesign --verify --strict "$sidecar"
          "${sidecar%/*}/assentor-desktop" --smoke-test
          du -h "$package"

      - name: Verify the Linux package binaries
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri/target/debug/bundle
        run: |
          package=$(find deb -name '*.deb' -print -quit)
          test -n "$package"
          unpacked=$(mktemp -d "$RUNNER_TEMP/assentor-deb.XXXXXX")
          dpkg-deb --extract "$package" "$unpacked"
          "$unpacked/usr/bin/assentor-desktop" --smoke-test
          du -h "$package"

      - name: Verify the Windows preview installer and resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = 'apps/desktop/src-tauri/target/debug'
          if (!(Get-ChildItem -Path "$target/bundle/nsis" -Filter '*setup.exe')) {
            throw 'No Windows installer was created.'
          }
          & "$target/assentor-desktop.exe" --smoke-test
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        with:
          name: assentor-desktop-preview-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/debug/bundle/**/*.dmg
            apps/desktop/src-tauri/target/debug/bundle/**/*.deb
            apps/desktop/src-tauri/target/debug/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/debug/bundle/**/*setup.exe
