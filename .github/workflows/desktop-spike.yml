name: Desktop sidecar spike

on:
  workflow_dispatch:
  push:
    branches: [desktop/phase-5]
    paths:
      - ".github/workflows/desktop-spike.yml"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/spike-ui/**"
      - "packages/cli/**"
      - "packages/engine/**"
      - "packages/protocol/**"
      - "packages/ui/**"
      - "packages/ui-shared/**"
      - "scripts/desktop/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: desktop-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Native handshake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    steps:
      - name: Set checkout line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - name: Check native architecture
        run: |
          node -p "process.platform + ' ' + process.arch"
          rustc -vV

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and smoke-test Node SEA
        run: |
          node scripts/desktop/build-sidecar.mjs
          pnpm build:ui

      - name: Build Tauri and verify the bundled sidecar handshake
        run: |
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo run --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --smoke-test
          node scripts/desktop/session-smoke.mjs apps/desktop/src-tauri/target/debug/assentor-desktop

      - name: Verify force-quit reaps a native child process tree
        run: node scripts/desktop/lifecycle/run.mjs

      - name: Verify the integration branch
        if: matrix.os == 'ubuntu-24.04'
        run: |
          git config --global user.name "Assentor CI"
          git config --global user.email "ci@assentor.invalid"
          pnpm typecheck
          pnpm test --maxWorkers=3
          pnpm build
